name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality-c.yml
    permissions:
      contents: read
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      obs: false
  build-obs:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      obs: true
